{% extends "sqladmin/layout.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[50vh] sm:min-h-[60vh] px-4">
    <div class="text-center">
        <div class="inline-flex items-center justify-center w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-red-100 mb-4 sm:mb-6">
            <span class="text-3xl sm:text-4xl font-bold text-red-500">{{ status_code }}</span>
        </div>
        <h2 class="text-xl sm:text-2xl font-bold text-gray-800 mb-2">Ops! Algo deu errado</h2>
        <p class="text-gray-600 mb-6 sm:mb-8 text-sm sm:text-base">{{ message }}</p>
        <a href="{{ url_for('admin:index') }}" class="inline-flex items-center gap-2 px-5 sm:px-6 py-2.5 sm:py-3 bg-primary hover:bg-primary/90 text-white rounded-lg transition-colors font-medium text-sm sm:text-base">
            <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
            Voltar ao início
        </a>
    </div>
</div>
{% endblock %}

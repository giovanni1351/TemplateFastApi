<div id="modal-delete" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-hidden="true">
    <div class="flex items-center justify-center min-h-screen px-4">
        <div class="fixed inset-0 bg-black/50 transition-opacity" onclick="this.parentElement.parentElement.classList.add('hidden')"></div>
        <div class="relative bg-white rounded-xl shadow-xl max-w-md w-full p-6">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-semibold text-gray-800">Confirmar exclusão</h3>
                    <p id="modal-delete-text" class="text-sm text-gray-500">Tem certeza que deseja excluir os itens selecionados?</p>
                </div>
            </div>
            <div class="flex justify-end gap-3">
                <button onclick="this.closest('#modal-delete').classList.add('hidden')" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors font-medium">
                    Cancelar
                </button>
                <button id="modal-delete-button" data-url="" onclick="fetch(this.dataset.url, {method: 'DELETE'}).then(() => window.location.reload())" class="px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-lg transition-colors font-medium">
                    Excluir
                </button>
            </div>
        </div>
    </div>
</div>

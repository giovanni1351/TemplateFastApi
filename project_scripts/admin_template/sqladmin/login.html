{% extends "sqladmin/base.html" %}

{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary/10 to-accent/10 p-4">
    <div class="w-full max-w-sm sm:max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8">
            <div class="text-center mb-6 sm:mb-8">
                {% if admin_config.logo_url %}
                <img src="{{ admin_config.logo_url }}" alt="{{ admin_config.nome_sistema }}" class="w-14 h-14 sm:w-16 sm:h-16 mx-auto mb-4 rounded-xl">
                {% else %}
                <div class="w-14 h-14 sm:w-16 sm:h-16 mx-auto mb-4 rounded-xl bg-primary flex items-center justify-center">
                    <span class="text-white text-xl sm:text-2xl font-bold">{{ admin_config.nome_sistema[0] }}</span>
                </div>
                {% endif %}
                <h2 class="text-xl sm:text-2xl font-bold text-gray-800">{{ admin_config.nome_sistema }}</h2>
                <p class="text-gray-500 mt-1 text-sm sm:text-base">{{ admin_config.nome_empresa }}</p>
            </div>

            {% if error %}
            <div class="mb-6 p-3 sm:p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('admin:login') }}" method="POST" autocomplete="off" class="space-y-4 sm:space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Usuário</label>
                    <input name="username" type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-base" placeholder="Digite seu usuário" autocomplete="off" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                    <input name="password" type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-colors text-base" placeholder="Digite sua senha" autocomplete="off" required>
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-primary hover:bg-primary/90 text-white font-medium rounded-lg transition-colors shadow-lg shadow-primary/25 text-base">
                    Entrar
                </button>
            </form>
        </div>
        <p class="text-center text-gray-400 text-xs sm:text-sm mt-4 sm:mt-6">
            &copy; {{ admin_config.nome_empresa }}
        </p>
    </div>
</div>
{% endblock %}
